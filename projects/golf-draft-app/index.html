<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="Private access to the Golf Major Intelligence player research workspace."
    />
    <title>Sign In | Golf Majors Draft Room</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080a0c;
        color: #f5f3ed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          #080a0c;
        background-size: 32px 32px;
      }

      a {
        color: inherit;
      }

      .back-link {
        position: fixed;
        top: max(22px, env(safe-area-inset-top));
        left: max(22px, env(safe-area-inset-left));
        color: #a5aaa7;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0;
        text-decoration: none;
        text-transform: uppercase;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 84px 22px 42px;
      }

      .login-shell {
        width: min(100%, 430px);
      }

      .mark {
        display: grid;
        width: 44px;
        height: 44px;
        margin-bottom: 28px;
        border: 1px solid #bba66a;
        color: #d8c58d;
        font-family: Georgia, serif;
        font-size: 1.2rem;
        place-items: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #bba66a;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        max-width: 390px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.25rem, 8vw, 3.7rem);
        font-weight: 500;
        line-height: 0.98;
        letter-spacing: 0;
      }

      .intro {
        margin: 20px 0 32px;
        color: #a5aaa7;
        font-size: 0.98rem;
        line-height: 1.65;
      }

      form {
        display: grid;
        gap: 18px;
        padding-top: 28px;
        border-top: 1px solid #292d2d;
      }

      label {
        display: grid;
        gap: 8px;
        color: #c9ccc9;
        font-size: 0.78rem;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 50px;
        border: 1px solid #343938;
        border-radius: 4px;
        outline: none;
        background: #111416;
        color: #f5f3ed;
        font: inherit;
        padding: 0 14px;
      }

      input:focus {
        border-color: #bba66a;
        box-shadow: 0 0 0 3px rgba(187, 166, 106, 0.14);
      }

      button {
        min-height: 50px;
        margin-top: 4px;
        border: 1px solid #d8c58d;
        border-radius: 4px;
        background: #d8c58d;
        color: #11120f;
        cursor: pointer;
        font: inherit;
        font-size: 0.82rem;
        font-weight: 850;
      }

      button:hover {
        background: #e6d59e;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .status {
        min-height: 20px;
        margin: -4px 0 0;
        color: #ee8b82;
        font-size: 0.82rem;
      }

      .access-note {
        margin: 26px 0 0;
        color: #747a77;
        font-size: 0.82rem;
      }

      .access-note a {
        color: #c9ccc9;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <a class="back-link" href="../../">Back to Playground</a>
    <main>
      <section class="login-shell" aria-labelledby="login-title">
        <div class="mark" aria-hidden="true">G</div>
        <p class="eyebrow">Private player research</p>
        <h1 id="login-title">Golf Majors Draft Room</h1>
        <p class="intro">
          A private workspace for player form, major history, course fit, and
          performance trends.
        </p>

        <form id="loginForm">
          <label>
            Username
            <input id="username" name="username" autocomplete="username" required />
          </label>
          <label>
            Password
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button id="submitButton" type="submit">Sign in</button>
          <p class="status" id="status" role="alert" aria-live="polite"></p>
        </form>

        <p class="access-note">
          Need access? <a href="mailto:gregorymstiles@gmail.com?subject=Golf%20Major%20Intelligence%20access">Reach out to Greg for the login.</a>
        </p>
      </section>
    </main>

    <script>
      const form = document.querySelector("#loginForm");
      const submitButton = document.querySelector("#submitButton");
      const status = document.querySelector("#status");
      const encoder = new TextEncoder();
      const additionalData = encoder.encode("golf-major-intelligence-v1");

      function decodeBase64(value) {
        return Uint8Array.from(atob(value), (character) => character.charCodeAt(0));
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        submitButton.textContent = "Opening...";
        status.textContent = "";

        try {
          const username = form.elements.username.value;
          const password = form.elements.password.value;
          const response = await fetch("vault.bin", { cache: "no-store" });

          if (!response.ok) {
            throw new Error("The private workspace is temporarily unavailable.");
          }

          const vault = await response.json();
          const credentialMaterial = await crypto.subtle.importKey(
            "raw",
            encoder.encode(`${username}\0${password}`),
            "PBKDF2",
            false,
            ["deriveKey"]
          );
          const key = await crypto.subtle.deriveKey(
            {
              name: "PBKDF2",
              salt: decodeBase64(vault.salt),
              iterations: vault.iterations,
              hash: "SHA-256"
            },
            credentialMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
          );
          const ciphertext = decodeBase64(vault.ciphertext);
          const authenticationTag = decodeBase64(vault.authenticationTag);
          const encryptedDocument = new Uint8Array(ciphertext.length + authenticationTag.length);
          encryptedDocument.set(ciphertext);
          encryptedDocument.set(authenticationTag, ciphertext.length);
          const decryptedDocument = await crypto.subtle.decrypt(
            {
              name: "AES-GCM",
              iv: decodeBase64(vault.initializationVector),
              additionalData,
              tagLength: 128
            },
            key,
            encryptedDocument
          );
          const decompressedDocument = new Blob([decryptedDocument])
            .stream()
            .pipeThrough(new DecompressionStream(vault.compression));
          const applicationHtml = await new Response(decompressedDocument).text();

          document.open();
          document.write(applicationHtml);
          document.close();
          window.scrollTo(0, 0);
        } catch (error) {
          const unavailable = error.message.includes("temporarily unavailable");
          status.textContent = unavailable
            ? error.message
            : "That username or password is not recognized.";
          submitButton.disabled = false;
          submitButton.textContent = "Sign in";
          form.elements.password.select();
        }
      });
    </script>
  </body>
</html>
